<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>3D 河内塔</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="title">🏯 河内塔 · 3D 挑战</header>

  <section class="controls">
    <label>
      圆盘数量：
      <input type="range" id="diskRange" min="3" max="8" value="5">
      <span id="diskCount">5</span>
    </label>

    <button id="resetBtn">🔄 重置</button>
    <button id="autoBtn">🤖 自动解题</button>

    <div class="stats">
      步数：<span id="moveCounter">0</span>
    </div>
  </section>

  <section class="scene">
    <div class="peg" data-index="0"></div>
    <div class="peg" data-index="1"></div>
    <div class="peg" data-index="2"></div>
  </section>

  <div id="warning" class="warning hidden">⚠️ 不能把大圆盘放在小圆盘上！</div>
  <div id="winMessage" class="win hidden">🎉 恭喜通关！</div>

  <script src="script.js"></script>
</body>
